<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ink_and_paper">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ink_and_paper</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      background: #a24731;
    }

    #ink-paper-preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #a24731;
      color: #ffffff;
      font-family: Georgia, 'Times New Roman', serif;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #ink-paper-preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .preloader-shell {
      width: min(320px, calc(100vw - 48px));
      display: grid;
      justify-items: center;
      gap: 18px;
      text-align: center;
    }

    .preloader-mark {
      width: min(132px, 32vw);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.18);
      animation: preloader-breathe 1300ms ease-in-out infinite;
    }

    .preloader-mark img {
      width: 78%;
      height: 78%;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .preloader-title {
      margin: 0;
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
    }

    .preloader-message {
      margin: -6px 0 0;
      color: rgba(255, 255, 255, 0.78);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .preloader-track {
      width: min(220px, 64vw);
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
    }

    .preloader-track::before {
      content: '';
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: #ffffff;
      animation: preloader-load 1100ms ease-in-out infinite;
    }

    @keyframes preloader-breathe {
      0%,
      100% {
        transform: translateY(0) scale(0.97);
      }

      50% {
        transform: translateY(-3px) scale(1);
      }
    }

    @keyframes preloader-load {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(260%);
      }
    }
  </style>
</head>
<body>
  <div id="ink-paper-preloader" aria-label="Loading Ink & Paper">
    <div class="preloader-shell">
      <div class="preloader-mark">
        <img src="assets/assets/logo/ink_paper_mark.svg" alt="Ink & Paper">
      </div>
      <h1 class="preloader-title">INK &amp; PAPER</h1>
      <p class="preloader-message">Preparing your notes...</p>
      <div class="preloader-track" aria-hidden="true"></div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var preloader = document.getElementById('ink-paper-preloader');
      if (!preloader) {
        return;
      }
      preloader.classList.add('hidden');
      window.setTimeout(function () {
        preloader.remove();
      }, 320);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
