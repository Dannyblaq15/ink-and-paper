<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ink_and_paper">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ink_and_paper</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      background: #a24731;
    }

    #ink-paper-preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #a24731;
      color: #ffffff;
      font-family: Georgia, 'Times New Roman', serif;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #ink-paper-preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .preloader-shell {
      width: min(300px, calc(100vw - 48px));
      display: grid;
      justify-items: center;
      gap: 18px;
      text-align: center;
    }

    .preloader-mark {
      position: relative;
      z-index: 1;
      width: min(220px, 54vw);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      animation: preloader-reveal 2200ms ease-in-out infinite;
    }

    .preloader-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: center;
    }

    .preloader-message {
      margin: 0;
      color: rgba(255, 255, 255, 0.8);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      animation: preloader-message 2200ms ease-in-out infinite;
    }

    @keyframes preloader-reveal {
      0% {
        opacity: 0;
        filter: blur(7px);
      }

      30% {
        opacity: 1;
        filter: blur(0);
      }

      68% {
        opacity: 1;
        filter: blur(0);
      }

      100% {
        opacity: 0;
        filter: blur(7px);
      }
    }

    @keyframes preloader-message {
      0%,
      100% {
        opacity: 0.45;
      }

      30%,
      68% {
        opacity: 0.9;
      }
    }
  </style>
</head>
<body>
  <div id="ink-paper-preloader" aria-label="Loading Ink & Paper">
    <div class="preloader-shell">
      <div class="preloader-mark">
        <img src="assets/assets/logo/ink_paper_mark.svg" alt="Ink & Paper">
      </div>
      <p class="preloader-message">Preparing your notes...</p>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var preloader = document.getElementById('ink-paper-preloader');
      if (!preloader) {
        return;
      }
      preloader.classList.add('hidden');
      window.setTimeout(function () {
        preloader.remove();
      }, 320);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
